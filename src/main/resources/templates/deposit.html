<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 存款</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .deposit-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .deposit-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .deposit-header h2 {
            color: #333;
            font-weight: bold;
        }
        .deposit-header .icon {
            font-size: 60px;
            color: #28a745;
        }
        .btn-deposit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-deposit:hover {
            background: linear-gradient(135deg, #218838 0%, #1aaa80 100%);
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 8px;
        }
        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .alert {
            border-radius: 8px;
        }
        .balance-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-info .amount {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="deposit-card">
        <div class="deposit-header">
            <div class="icon">&#128176;</div>
            <h2>存款</h2>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        
        <div class="balance-info">
            <div>当前余额</div>
            <div class="amount"><span th:text="${#numbers.formatDecimal(account.money, 1, 2)}"></span> 元</div>
        </div>
        
        <form th:action="@{/deposit}" method="post">
            <div class="mb-3">
                <label for="amount" class="form-label">存款金额（元）</label>
                <input type="number" class="form-control" id="amount" name="amount" 
                       placeholder="请输入存款金额" required min="0.01" step="0.01">
            </div>
            <button type="submit" class="btn btn-deposit w-100">确认存款</button>
        </form>
        
        <a th:href="@{/main}" class="btn btn-back">返回主菜单</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
