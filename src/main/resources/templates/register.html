<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 开户</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h2 {
            color: #333;
            font-weight: bold;
        }
        .register-header .icon {
            font-size: 60px;
            color: #667eea;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .form-control, .form-select {
            padding: 12px 15px;
            border-radius: 8px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .alert {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <div class="icon">&#127974;</div>
            <h2>ATM系统开户</h2>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        
        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label for="userName" class="form-label">账户名称</label>
                <input type="text" class="form-control" id="userName" name="userName" 
                       placeholder="请输入您的姓名" required>
            </div>
            <div class="mb-3">
                <label for="sex" class="form-label">性别</label>
                <select class="form-select" id="sex" name="sex" required>
                    <option value="">请选择性别</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="请输入密码" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">确认密码</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                       placeholder="请再次输入密码" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="limit" class="form-label">取现额度（元）</label>
                <input type="number" class="form-control" id="limit" name="limit" 
                       placeholder="请输入每次取现额度" required min="100" step="100">
            </div>
            <button type="submit" class="btn btn-primary w-100">立即开户</button>
        </form>
        
        <div class="login-link">
            <p>已有账户？<a th:href="@{/login}">立即登录</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
