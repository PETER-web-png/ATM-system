<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 转账</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transfer-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .transfer-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .transfer-header h2 {
            color: #333;
            font-weight: bold;
        }
        .transfer-header .icon {
            font-size: 60px;
            color: #17a2b8;
        }
        .btn-transfer {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-transfer:hover {
            background: linear-gradient(135deg, #138496 0%, #117a8b 100%);
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 8px;
        }
        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .alert {
            border-radius: 8px;
        }
        .balance-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-info .amount {
            font-size: 24px;
            font-weight: bold;
            color: #17a2b8;
        }
        .tip-info {
            background: #d1ecf1;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="transfer-card">
        <div class="transfer-header">
            <div class="icon">&#128184;</div>
            <h2>转账</h2>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        
        <div class="balance-info">
            <div>当前余额</div>
            <div class="amount"><span th:text="${#numbers.formatDecimal(account.money, 1, 2)}"></span> 元</div>
        </div>
        
        <div class="tip-info">
            <strong>提示：</strong>转账需要验证收款人姓名，请确认输入正确的姓名
        </div>
        
        <form th:action="@{/transfer}" method="post">
            <div class="mb-3">
                <label for="toCardId" class="form-label">转入卡号</label>
                <input type="text" class="form-control" id="toCardId" name="toCardId" 
                       placeholder="请输入对方8位卡号" required maxlength="8" pattern="\d{8}">
            </div>
            <div class="mb-3">
                <label for="recipientName" class="form-label">收款人姓名</label>
                <input type="text" class="form-control" id="recipientName" name="recipientName" 
                       placeholder="请输入收款人完整姓名" required>
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">转账金额（元）</label>
                <input type="number" class="form-control" id="amount" name="amount" 
                       placeholder="请输入转账金额" required min="0.01" step="0.01">
            </div>
            <button type="submit" class="btn btn-transfer w-100">确认转账</button>
        </form>
        
        <a th:href="@{/main}" class="btn btn-back">返回主菜单</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
