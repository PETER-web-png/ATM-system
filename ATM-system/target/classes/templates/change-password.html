<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .password-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .password-header h2 {
            color: #333;
            font-weight: bold;
        }
        .password-header .icon {
            font-size: 60px;
            color: #ffc107;
        }
        .btn-change {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
            color: #333;
        }
        .btn-change:hover {
            background: linear-gradient(135deg, #e0a800 0%, #e68a00 100%);
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 8px;
        }
        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .alert {
            border-radius: 8px;
        }
        .account-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }
        .account-info .card-id {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="password-card">
        <div class="password-header">
            <div class="icon">&#128274;</div>
            <h2>修改密码</h2>
        </div>
        
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        
        <div class="account-info">
            <div>当前卡号</div>
            <div class="card-id" th:text="${account.cardId}"></div>
        </div>
        
        <form th:action="@{/change-password}" method="post">
            <div class="mb-3">
                <label for="oldPassword" class="form-label">当前密码</label>
                <input type="password" class="form-control" id="oldPassword" name="oldPassword" 
                       placeholder="请输入当前密码" required>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">新密码</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" 
                       placeholder="请输入新密码" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">确认新密码</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                       placeholder="请再次输入新密码" required minlength="6">
            </div>
            <button type="submit" class="btn btn-change w-100">确认修改</button>
        </form>
        
        <a th:href="@{/main}" class="btn btn-back">返回主菜单</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
