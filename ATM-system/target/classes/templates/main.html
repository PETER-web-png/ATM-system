<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 主菜单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .welcome-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }
        .welcome-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .welcome-header h2 {
            color: #333;
            font-weight: bold;
            margin: 0;
        }
        .btn-logout {
            background: #dc3545;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
        }
        .btn-logout:hover {
            background: #c82333;
        }
        .account-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .account-info .balance {
            font-size: 36px;
            font-weight: bold;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: #333;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            color: #333;
        }
        .menu-item .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .menu-item h5 {
            margin: 0;
            font-weight: bold;
        }
        .alert {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="welcome-card">
            <div class="welcome-header">
                <h2>欢迎使用ATM系统</h2>
                <a th:href="@{/logout}" class="btn btn-logout">退出登录</a>
            </div>
            
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>
            
            <div class="account-info">
                <div class="mb-2">
                    <strong>卡号：</strong><span th:text="${account.cardId}"></span>
                </div>
                <div class="mb-2">
                    <strong>户主：</strong><span th:text="${account.displayName}"></span>
                </div>
                <div class="mb-2">
                    <strong>性别：</strong><span th:text="${account.sex}"></span>
                </div>
                <div class="balance mt-3">
                    <strong>余额：</strong><span th:text="${#numbers.formatDecimal(account.money, 1, 2)}"></span> 元
                </div>
            </div>
            
            <div class="menu-grid">
                <a th:href="@{/account}" class="menu-item">
                    <div class="icon">&#128196;</div>
                    <h5>查询账户</h5>
                </a>
                <a th:href="@{/deposit}" class="menu-item">
                    <div class="icon">&#128176;</div>
                    <h5>存款</h5>
                </a>
                <a th:href="@{/withdraw}" class="menu-item">
                    <div class="icon">&#128179;</div>
                    <h5>取款</h5>
                </a>
                <a th:href="@{/transfer}" class="menu-item">
                    <div class="icon">&#128184;</div>
                    <h5>转账</h5>
                </a>
                <a th:href="@{/change-password}" class="menu-item">
                    <div class="icon">&#128274;</div>
                    <h5>密码修改</h5>
                </a>
                <a href="#" class="menu-item" data-bs-toggle="modal" data-bs-target="#deleteModal">
                    <div class="icon">&#128465;</div>
                    <h5>注销账户</h5>
                </a>
            </div>
        </div>
    </div>
    
    <!-- 注销确认弹窗 -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认注销</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>确定要注销当前账户吗？此操作不可恢复。</p>
                    <p th:if="${account.money > 0}" class="text-danger">
                        <strong>警告：您的账户还有余额 <span th:text="${#numbers.formatDecimal(account.money, 1, 2)}"></span> 元，无法注销！</strong>
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <form th:action="@{/delete}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger" th:disabled="${account.money > 0}">确认注销</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
