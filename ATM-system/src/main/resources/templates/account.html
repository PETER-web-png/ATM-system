<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM系统 - 账户信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        .info-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .info-header h2 {
            color: #333;
            font-weight: bold;
        }
        .info-header .icon {
            font-size: 60px;
            color: #667eea;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
            font-weight: 500;
        }
        .info-value {
            color: #333;
            font-weight: bold;
        }
        .balance-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .balance-highlight .amount {
            font-size: 36px;
            font-weight: bold;
        }
        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
        }
        .btn-back:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="info-card">
        <div class="info-header">
            <div class="icon">&#128196;</div>
            <h2>账户信息</h2>
        </div>
        
        <div class="info-item">
            <span class="info-label">卡号</span>
            <span class="info-value" th:text="${account.cardId}"></span>
        </div>
        <div class="info-item">
            <span class="info-label">户主</span>
            <span class="info-value" th:text="${account.displayName}"></span>
        </div>
        <div class="info-item">
            <span class="info-label">性别</span>
            <span class="info-value" th:text="${account.sex}"></span>
        </div>
        <div class="info-item">
            <span class="info-label">每次取现额度</span>
            <span class="info-value"><span th:text="${#numbers.formatDecimal(account.limit, 1, 2)}"></span> 元</span>
        </div>
        
        <div class="balance-highlight">
            <div>当前余额</div>
            <div class="amount"><span th:text="${#numbers.formatDecimal(account.money, 1, 2)}"></span> 元</div>
        </div>
        
        <a th:href="@{/main}" class="btn btn-back">返回主菜单</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
